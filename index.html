<!-- Form -->
<form id="quoteForm">

    <!-- Thickness -->

    <!-- Price Information -->
    <div class="price-info">

</div>

<script>

    // Rates per sheet
    const rates = {
        '1': 1250,
        '2': 1400,
        '3': 1550,
        '4': 7.00,
        '5': 8.50
    };

    // GST rates
    const CGST_RATE = 0.09;
    const SGST_RATE = 0.09;


    // DOM elements
    const thicknessSelect =
        document.getElementById('thickness');

    const quantityInput =
        document.getElementById('quantity');

    const gstRadios =
        document.querySelectorAll('input[name="gst"]');

    const selectedThicknessSpan =
        document.getElementById('selectedThickness');

    const rateDisplay =
        document.getElementById('rateDisplay');

    const quantityDisplay =
        document.getElementById('quantityDisplay');

    const subtotalDisplay =
        document.getElementById('subtotalDisplay');

    const cgstDisplay =
        document.getElementById('cgstDisplay');

    const sgstDisplay =
        document.getElementById('sgstDisplay');

    const totalDisplay =
        document.getElementById('totalDisplay');

    const cgstRow =
        document.getElementById('cgstRow');

    const sgstRow =
        document.getElementById('sgstRow');

    const resetBtn =
        document.getElementById('resetBtn');

    const orderListDiv =
        document.getElementById('orderList');


    // Load saved orders
    let orders =
        JSON.parse(
            localStorage.getItem('steelSheetOrders')
        ) || [];


    // Update calculation
    function updateCalculation() {

        const thickness =
            thicknessSelect.value;

        const quantity =
            parseInt(quantityInput.value) || 0;

        const gstSelected =
            document.querySelector(
                'input[name="gst"]:checked'
            ).value === 'yes';


        // Price information
        if (thickness && rates[thickness]) {

            const selectedOption =
                thicknessSelect.options[
                    thicknessSelect.selectedIndex
                ];

            selectedThicknessSpan.textContent =
                selectedOption.text;

            rateDisplay.textContent =
                '₹' +
                rates[thickness].toFixed(2);

        } else {

            selectedThicknessSpan.textContent = '—';

            rateDisplay.textContent = '₹0.00';

        }


        // Calculation
        const pricePerSheet =
            rates[thickness] || 0;

        const subtotal =
            pricePerSheet * quantity;

        const cgstAmount =
            gstSelected
                ? subtotal * CGST_RATE
                : 0;

        const sgstAmount =
            gstSelected
                ? subtotal * SGST_RATE
                : 0;

        const total =
            subtotal +
            cgstAmount +
            sgstAmount;


        // Display
        quantityDisplay.textContent =
            quantity + ' sheets';

        subtotalDisplay.textContent =
            '₹' + subtotal.toFixed(2);

        cgstDisplay.textContent =
            '₹' + cgstAmount.toFixed(2);

        sgstDisplay.textContent =
            '₹' + sgstAmount.toFixed(2);

        totalDisplay.textContent =
            '₹' + total.toFixed(2);


        // Show / hide GST
        if (gstSelected) {

            cgstRow.style.display = 'flex';

            sgstRow.style.display = 'flex';

        } else {

            cgstRow.style.display = 'none';

            sgstRow.style.display = 'none';

        }

    }


    // Event listeners
    thicknessSelect.addEventListener(
        'change',
        updateCalculation
    );

    quantityInput.addEventListener(
        'input',
        updateCalculation
    );

    gstRadios.forEach(
        radio =>
            radio.addEventListener(
                'change',
                updateCalculation
            )
    );


    // Initial calculation
    updateCalculation();


    // Submit order
    document
        .getElementById('quoteForm')
        .addEventListener('submit', function(e) {

            e.preventDefault();


            const thickness =
                thicknessSelect.value;

            if (!thickness) {

                alert(
                    'Please select a sheet thickness.'
                );

                return;
            }


            const quantity =
                parseInt(quantityInput.value);


            if (!quantity || quantity < 1) {

                alert(
                    'Please enter a valid quantity.'
                );

                return;
            }


            const gstSelected =
                document.querySelector(
                    'input[name="gst"]:checked'
                ).value === 'yes';


            const pricePerSheet =
                rates[thickness];

            const subtotal =
                pricePerSheet * quantity;

            const cgstAmount =
                gstSelected
                    ? subtotal * CGST_RATE
                    : 0;

            const sgstAmount =
                gstSelected
                    ? subtotal * SGST_RATE
                    : 0;

            const total =
                subtotal +
                cgstAmount +
                sgstAmount;


            const selectedOption =
                thicknessSelect.options[
                    thicknessSelect.selectedIndex
                ];


            const order = {

                id: Date.now(),

                thickness:
                    selectedOption.text,

                quantity:
                    quantity,

                pricePerSheet:
                    pricePerSheet,

                gst:
                    gstSelected,

                cgstAmount:
                    cgstAmount,

                sgstAmount:
                    sgstAmount,

                subtotal:
                    subtotal,

                total:
                    total,

                createdAt:
                    new Date().toLocaleString()

            };


            orders.push(order);


            localStorage.setItem(
                'steelSheetOrders',
                JSON.stringify(orders)
            );


            renderOrders();

            resetForm();


            alert(
                '✅ Order submitted successfully!'
            );

        });


    // Reset
    resetBtn.addEventListener(
        'click',
        resetForm
    );


    function resetForm() {

        thicknessSelect.value = '';

        quantityInput.value = '1';

        document.querySelector(
            'input[name="gst"][value="no"]'
        ).checked = true;

        updateCalculation();

    }


    // Render order history
    function renderOrders() {

        if (orders.length === 0) {

            orderListDiv.innerHTML =
                '<div class="empty-orders">' +
                'No orders yet. Submit your first quote above.' +
                '</div>';

            return;
        }


        let html = '';


        orders.forEach(
            (order, index) => {

                const gstLabel =
                    order.gst
                        ? 'GST: CGST 9% + SGST 9%'
                        : 'Non-GST';


                html += `

                    <div class="order-card">

                        <div class="order-details">

                            <strong>
                                Order #${index + 1}
                            </strong>

                            (${order.createdAt})

                            <br>

                            Thickness:
                            ${order.thickness}

                            |
                            
                            Quantity:
                            ${order.quantity} sheets

                            <br>

                            Rate:
                            ₹${order.pricePerSheet.toFixed(2)}
                            /sheet

                            <br>
