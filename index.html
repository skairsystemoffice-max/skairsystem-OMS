<body>

<div class="container">

  <h1>📋 Steel Sheet Quotation</h1>

  <p class="subtitle">
    Select your requirements and get an instant quote
  </p>

  <div id="statusMessage" class="status"></div>

  <form id="quoteForm">

    <!-- SHEET THICKNESS -->
    <div class="form-group">

      <label for="thickness">
        Sheet Thickness
      </label>

      <select id="thickness" required>

        <option value="">
          -- Select --
        </option>

        <option value="1">
          22G - 0.80 mm
        </option>

        <option value="2">
          24G - 0.60 mm
        </option>

        <option value="3">
          23G - 0.70 mm
        </option>

        <option value="4">
          18G - 1.20 mm
        </option>

        <option value="5">
          20G - 1.00 mm
        </option>

    </div>


    <!-- QUANTITY -->
    <div class="form-group">

      <label for="quantity">
        Quantity (sheets)
      </label>

      <input
        type="number"
        id="quantity"
        min="1"
        step="1"
        value="1"
        required
      >

    </div>


    <!-- GST -->
    <div class="form-group">

      <label>
        GST Option
      </label>

      <div class="radio-group">

        <label>
          <input
            type="radio"
            name="gst"
            value="no"
            checked
          >
          Non-GST
        </label>

        <label>
          <input
            type="radio"
            name="gst"
            value="yes"
          >
          GST - CGST 9% + SGST 9%
        </label>

      </div>

    </div>


    <!-- PRICE -->
    <div class="price-info">

      Selected:
      <span id="selectedThickness">—</span>

      &nbsp; | &nbsp;

      Rate:
      <span id="rateDisplay">₹0.00</span>

      /sheet

    </div>


    <!-- CALCULATION -->
    <div class="calculation">

      <div class="calc-row">

        <span>
          Quantity
        </span>

        <span id="quantityDisplay">
          0 sheets
        </span>

      </div>


      <div class="calc-row">

        <span>
          Subtotal
        </span>

        <span id="subtotalDisplay">
          ₹0.00
        </span>

      </div>


      <div
        class="calc-row gst-amount"
        id="cgstRow"
        style="display:none;"
      >

        <span>
          CGST (9%)
        </span>

        <span id="cgstDisplay">
          ₹0.00
        </span>

      </div>


      <div
        class="calc-row gst-amount"
        id="sgstRow"
        style="display:none;"
      >

        <span>
          SGST (9%)
        </span>

        <span id="sgstDisplay">
          ₹0.00
        </span>

        </span>

        </span>

  </form>


  <!-- ORDER HISTORY -->
  <div class="order-history">

    <h2>
      📦 Your Orders
    </h2>

    <div id="orderList"></div>

  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
   =====================================================

   This is your current /exec URL.
   ===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyfGbakra6fLD0omRR_gRlxcTtYe9pFbIhTX1nx5j9lXE6NTV5H_v2OYCYGz0CV_uzC/exec";


/* =====================================================
   RATES
   ===================================================== */

const rates = {

  "1": 1250,

  "2": 1400,

  "3": 1550,

  "4": 7.00,

  "5": 8.50

};


/* =====================================================
   GST
   ===================================================== */

const CGST_RATE = 0.09;

const SGST_RATE = 0.09;


/* =====================================================
   DOM ELEMENTS
   ===================================================== */

const quoteForm =
document.getElementById("quoteForm");

const thicknessSelect =
document.getElementById("thickness");

const quantityInput =
document.getElementById("quantity");

const gstRadios =
document.querySelectorAll(
  'input[name="gst"]'
);

const selectedThicknessSpan =
document.getElementById(
  "selectedThickness"
);

const rateDisplay =
document.getElementById(
  "rateDisplay"
);

const quantityDisplay =
document.getElementById(
  "quantityDisplay"
);

const subtotalDisplay =
document.getElementById(
  "subtotalDisplay"
);

const cgstDisplay =
document.getElementById(
  "cgstDisplay"
);

const sgstDisplay =
document.getElementById(
  "sgstDisplay"
);

const totalDisplay =
document.getElementById(
  "totalDisplay"
);

const cgstRow =
document.getElementById(
  "cgstRow"
);

const sgstRow =
document.getElementById(
  "sgstRow"
);

const submitBtn =
document.getElementById(
  "submitBtn"
);

const resetBtn =
document.getElementById(
  "resetBtn"
);

const statusMessage =
document.getElementById(
  "statusMessage"
);

const orderListDiv =
document.getElementById(
  "orderList"
);


/* =====================================================
   LOCAL ORDER HISTORY
   ===================================================== */

let orders =
JSON.parse(
  localStorage.getItem(
    "steelSheetOrders"
  )
) || [];


/* =====================================================
   MONEY FORMAT
   ===================================================== */

function formatMoney(value) {

  return "₹" +
    Number(value).toFixed(2);

}


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(
  message,
  type
) {

  statusMessage.textContent =
    message;

  statusMessage.className =
    "status " + type;

}


/* =====================================================
   CALCULATION
   ===================================================== */

function getCalculation() {

  const thickness =
    thicknessSelect.value;

  const quantity =
    parseInt(
      quantityInput.value,
      10
    ) || 0;

  const gstSelected =
    document.querySelector(
      'input[name="gst"]:checked'
    ).value === "yes";

  const pricePerSheet =
    rates[thickness] || 0;

  const subtotal =
    pricePerSheet *
    quantity;

  const cgstAmount =
    gstSelected
      ? subtotal * CGST_RATE
      : 0;

  const sgstAmount =
    gstSelected
      ? subtotal * SGST_RATE
      : 0;

  const total =
    subtotal +
    cgstAmount +
    sgstAmount;

  return {

    thickness,

    quantity,

    gstSelected,

    pricePerSheet,

    subtotal,

    cgstAmount,

    sgstAmount,

    total

  };

}


/* =====================================================
   UPDATE CALCULATION
   ===================================================== */

function updateCalculation() {

  const calc =
    getCalculation();


  if (
    calc.thickness &&
    rates[calc.thickness] !== undefined
  ) {

    const selectedOption =
      thicknessSelect.options[
        thicknessSelect.selectedIndex
      ];

    selectedThicknessSpan.textContent =
      selectedOption.text;

    rateDisplay.textContent =
      formatMoney(
        calc.pricePerSheet
      );

  } else {

    selectedThicknessSpan.textContent =
      "—";

    rateDisplay.textContent =
      "₹0.00";

  }


  quantityDisplay.textContent =
    calc.quantity +
    " sheets";


  subtotalDisplay.textContent =
    formatMoney(
      calc.subtotal
    );


  cgstDisplay.textContent =
    formatMoney(
      calc.cgstAmount
    );


  sgstDisplay.textContent =
    formatMoney(
      calc.sgstAmount
    );


  totalDisplay.textContent =
    formatMoney(
      calc.total
    );


  if (calc.gstSelected) {

    cgstRow.style.display =
      "flex";

    sgstRow.style.display =
      "flex";

  } else {

    cgstRow.style.display =
      "none";

    sgstRow.style.display =
      "none";

  }

}


/* =====================================================
   EVENT LISTENERS
   ===================================================== */

thicknessSelect.addEventListener(
  "change",
  updateCalculation
);


quantityInput.addEventListener(
  "input",
  updateCalculation
);


gstRadios.forEach(
  function(radio) {

    radio.addEventListener(
      "change",
      updateCalculation
    );

  }
);


/* =====================================================
   SUBMIT TO GOOGLE SHEETS
   ===================================================== */

quoteForm.addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();


    const calc =
      getCalculation();


    if (!calc.thickness) {

      showStatus(
        "Please select a sheet thickness.",
        "error"
      );

      return;

    }


    if (
      !calc.quantity ||
      calc.quantity < 1
    ) {

      showStatus(
        "Please enter a valid quantity.",
        "error"
      );

      return;

    }


    const selectedOption =
      thicknessSelect.options[
        thicknessSelect.selectedIndex
      ];


    /*
      Generate order number.
    */

    const orderNo =
      "ORD-" + Date.now();


    /*
      Data sent to Google Apps Script.
    */

    const orderData = {

      orderNo:
        orderNo,

      thickness:
        selectedOption.text,

      quantity:
        calc.quantity,

      pricePerSheet:
        calc.pricePerSheet,

      subtotal:
        calc.subtotal,

      cgstAmount:
        calc.cgstAmount,

      sgstAmount:
        calc.sgstAmount,

      total:
        calc.total,

      gstType:
        calc.gstSelected
          ? "CGST 9% + SGST 9%"
          : "Non-GST"

    };


    submitBtn.disabled =
      true;

    submitBtn.textContent =
      "⏳ Saving...";


    showStatus(
      "Saving order to Google Sheets...",
      "info"
    );


    try {

      /*
        Send data to Apps Script.

        IMPORTANT:
        Do not add mode:"no-cors".
      */

      const response =
        await fetch(
          GOOGLE_SCRIPT_URL,
          {

            method:
              "POST",

            redirect:
              "follow",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(
                orderData
              )

          }
        );


      if (!response.ok) {

        throw new Error(
          "Server returned HTTP " +
          response.status
        );

      }


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.error ||
          "Google Sheets did not confirm the save."
        );

      }


      /*
        Google Apps Script successfully
        saved the data.
      */

      const savedOrderNo =
        result.orderNo ||
        orderNo;


      /*
        Save local browser copy.
      */

      const localOrder = {

        id:
          Date.now(),

        orderNo:
          savedOrderNo,

        thickness:
          selectedOption.text,

        quantity:
          calc.quantity,

        pricePerSheet:
          calc.pricePerSheet,

        gst:
          calc.gstSelected,

        cgstAmount:
          calc.cgstAmount,

        sgstAmount:
          calc.sgstAmount,

        subtotal:
          calc.subtotal,

        total:
          calc.total,

        createdAt:
          new Date()
            .toLocaleString()

      };


      orders.push(
        localOrder
      );


      localStorage.setItem(
        "steelSheetOrders",
        JSON.stringify(
          orders
        )
      );


      renderOrders();


      showStatus(
        "✅ Saved successfully in Google Sheets. Order No: " +
        savedOrderNo,
        "success"
      );


      /*
        Reset form after successful save.
      */

      resetForm(
        false
      );


    } catch(error) {

      console.error(
        "Google Sheets error:",
        error
      );


      showStatus(
        "❌ Could not save to Google Sheets. " +
        error.message,
        "error"
      );


    } finally {

      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "📩 Submit Order";

    }

  }
);


/* =====================================================
   RESET
   ===================================================== */

resetBtn.addEventListener(
  "click",
  function() {

    resetForm(
      true
    );

  }
);


function resetForm(
  clearMessage
) {

  thicknessSelect.value =
    "";

  quantityInput.value =
    "1";


  document.querySelector(
    'input[name="gst"][value="no"]'
  ).checked =
    true;


  updateCalculation();


  if (clearMessage) {

    statusMessage.textContent =
      "";

    statusMessage.className =
      "status";

  }

}


/* =====================================================
   RENDER LOCAL ORDERS
   ===================================================== */

function renderOrders() {

  if (
    orders.length === 0
  ) {

    orderListDiv.innerHTML =
      '<div class="empty-orders">' +
      'No orders yet. Submit your first quote above.' +
      '</div>';

    return;

  }


  let html = "";


  [...orders]
    .reverse()
    .forEach(
      function(order) {

        const gstLabel =
          order.gst
            ? "GST: CGST 9% + SGST 9%"
            : "Non-GST";


        html += `

          <div class="order-card">

            <div class="order-details">

              <strong>
                ${order.orderNo || "Local Order"}
              </strong>

              (${order.createdAt})

              <br>

              Thickness:
              ${order.thickness}

              <br>

              Quantity:
              ${order.quantity}
              sheets

              <br>

              Rate:
              ${formatMoney(
                order.pricePerSheet
              )}
              /sheet

              <br>

              Subtotal:
              ${formatMoney(
                order.subtotal
              )}

              <br>

              CGST (9%):
              ${formatMoney(
                order.cgstAmount
              )}

              &nbsp; | &nbsp;

              SGST (9%):
              ${formatMoney(
                order.sgstAmount
              )}

              <br>

              <strong>
                Total:
                ${formatMoney(
                  order.total
                )}
              </strong>

              <br>

              ${gstLabel}

            </div>


            <div class="order-actions">

              <button
                class="edit-btn"
                type="button"
                onclick="editOrder(${order.id})"
              >
                ✏️ Edit
              </button>


              <button
                class="delete-btn"
                type="button"
                onclick="deleteOrder(${order.id})"
              >
                🗑️ Delete
              </button>

            </div>

          </div>

        `;

      }
    );


  orderListDiv.innerHTML =
    html;

}


/* =====================================================
   EDIT LOCAL ORDER
   ===================================================== */

window.editOrder =
function(id) {

  const order =
    orders.find(
      function(item) {

        return item.id === id;

      }
    );


  if (!order) {

    return;

  }


  for (
    let i = 0;
    i < thicknessSelect.options.length;
    i++
  ) {

    if (
      thicknessSelect.options[i].text ===
      order.thickness
    ) {

      thicknessSelect.value =
        thicknessSelect.options[i].value;

      break;

    }

  }


  quantityInput.value =
    order.quantity;


  document.querySelector(
    order.gst
      ? 'input[name="gst"][value="yes"]'
      : 'input[name="gst"][value="no"]'
  ).checked =
    true;


  updateCalculation();


  /*
    Remove local copy.

    The existing Google Sheet row
    is NOT changed by this function.
  */

  orders =
    orders.filter(
      function(item) {

        return item.id !== id;

      }
    );


  localStorage.setItem(
    "steelSheetOrders",
    JSON.stringify(
      orders
    )
  );


  renderOrders();


  showStatus(
    "Order loaded for editing. Click Submit Order to save it again.",
    "info"
  );


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

};


/* =====================================================
   DELETE LOCAL ORDER
   ===================================================== */

window.deleteOrder =
function(id) {

  if (
    !confirm(
      "Delete this order from local history?"
    )
  ) {

    return;

  }


  /*
    This deletes only the browser copy.
    It does NOT delete the Google Sheet row.
  */

  orders =
    orders.filter(
      function(item) {

        return item.id !== id;

      }
    );


  localStorage.setItem(
    "steelSheetOrders",
    JSON.stringify(
      orders
    )
  );


  renderOrders();

};


/* =====================================================
   INITIALIZE
   ===================================================== */

updateCalculation();

renderOrders();

</script>

</body>
