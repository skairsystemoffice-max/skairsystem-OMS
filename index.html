<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SK Air System Sheet Quotation</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #333;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .radio-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .radio-group input {
      width: auto;
    }

    .price-info {
      background: #f1f3f5;
      padding: 14px;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    .calculation {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      margin-bottom: 20px;
    }

    .calc-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #eee;
    }

    .calc-row:last-child {
      border-bottom: none;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      padding-top: 15px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      border: none;
      padding: 13px;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-primary {
      background: #222;
      color: white;
    }

    .btn-primary:hover {
      background: #444;
    }

    .btn-secondary {
      background: #ddd;
      color: #222;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 20px;
      display: none;
    }

    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }

    .status.info {
      display: block;
      background: #d9edf7;
      color: #31708f;
    }

    .order-history {
      margin-top: 35px;
    }

    .order-card {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .order-card strong {
      display: inline-block;
      min-width: 130px;
    }

    .required {
      color: red;
    }

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .container {
        padding: 20px;
      }

      .btn-group {
        flex-direction: column;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <h1>📋 SK Air System Sheet Quotation</h1>

  <p class="subtitle">
    Select your requirements and get an instant quote
  </p>

  <div id="statusMessage" class="status"></div>

  <form id="quoteForm">

    <!-- CUSTOMER DETAILS -->

    <div class="form-group">

      <label for="clientName">
        Client Name <span class="required">*</span>
      </label>

      <input
        type="text"
        id="clientName"
        placeholder="Enter client name"
        required
      >

    </div>

    <div class="form-group">

      <label for="companyName">
        Company Name <span class="required">*</span>
      </label>

      <input
        type="text"
        id="companyName"
        placeholder="Enter company name"
        required
      >

    </div>


    <!-- SHEET THICKNESS -->

    <div class="form-group">

      <label for="thickness">
        Sheet Thickness <span class="required">*</span>
      </label>

      <select id="thickness" required>

        <option value="">
          -- Select Thickness --
        </option>

        <option value="1">
          22G - 0.80 mm
        </option>

        <option value="2">
          24G - 0.60 mm
        </option>

        <option value="3">
          23G - 0.70 mm
        </option>

        <option value="4">
          18G - 1.20 mm
        </option>

        <option value="5">
          20G - 1.00 mm
        </option>

      </select>

    </div>


    <!-- TYPE OF SHEET -->

    <div class="form-group">

      <label for="typeOfSheet">
        Type of Sheet <span class="required">*</span>
      </label>

      <select id="typeOfSheet" required>

        <option value="">
          -- Select Type of Sheet --
        </option>

        <option value="Groove">
          Groove
        </option>

        <option value="Plain">
          Plain
        </option>

      </select>

    </div>


    <!-- QUANTITY -->

    <div class="form-group">

      <label for="quantity">
        Quantity (Sheets) <span class="required">*</span>
      </label>

      <input
        type="number"
        id="quantity"
        min="1"
        step="1"
        value="1"
        required
      >

    </div>


    <!-- GST -->

    <div class="form-group">

      <label>
        GST Option
      </label>

      <div class="radio-group">

        <label>

          <input
            type="radio"
            name="gst"
            value="no"
            checked
          >

          Non-GST

        </label>

        <label>

          <input
            type="radio"
            name="gst"
            value="yes"
          >

          GST - CGST 9% + SGST 9%

        </label>

      </div>

    </div>


    <!-- PRICE INFORMATION -->

    <div class="price-info">

      <div>
        Selected:
        <strong id="selectedThickness">—</strong>
      </div>

      <div>
        Type:
        <strong id="selectedType">—</strong>
      </div>

      <div>
        Rate:
        <strong id="rateDisplay">₹0.00</strong>
        / sheet
      </div>

    </div>


    <!-- CALCULATION -->

    <div class="calculation">

      <div class="calc-row">

        <span>
          Quantity
        </span>

        <span id="quantityDisplay">
          0 sheets
        </span>

      </div>

      <div class="calc-row">

        <span>
          Subtotal
        </span>

        <span id="subtotalDisplay">
          ₹0.00
        </span>

      </div>

      <div
        class="calc-row"
        id="cgstRow"
        style="display:none;"
      >

        <span>
          CGST (9%)
        </span>

        <span id="cgstDisplay">
          ₹0.00
        </span>

      </div>

      <div
        class="calc-row"
        id="sgstRow"
        style="display:none;"
      >

        <span>
          SGST (9%)
        </span>

        <span id="sgstDisplay">
          ₹0.00
        </span>

      </div>

      <div class="calc-row total">

        <span>
          Total
        </span>

        <span id="totalDisplay">
          ₹0.00
        </span>

      </div>

    </div>


    <!-- BUTTONS -->

    <div class="btn-group">

      <button
        type="submit"
        class="btn-primary"
        id="submitBtn"
      >
        📩 Submit Order
      </button>

      <button
        type="button"
        class="btn-secondary"
        id="resetBtn"
      >
        🔄 Reset
      </button>

    </div>

  </form>


  <!-- ORDER HISTORY -->

  <div class="order-history">

    <h2>
      📦 Your Orders
    </h2>

    <div id="orderList"></div>

  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT URL
   ===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyfGbakra6fLD0omRR_gRlxcTtYe9pFbIhTX1nx5j9lXE6NTV5H_v2OYCYGz0CV_uzC/exec";


/* =====================================================
   RATES FROM EXTERNAL rates.txt
   Format:

   thicknessValue|type|GST/Non-GST|rate

   Example:

   1|Groove|Non-GST|1250
   1|Groove|GST|1250
   1|Plain|Non-GST|1300
   1|Plain|GST|1300
   ===================================================== */

const RATES_FILE = "rates.txt";

let rates = {};

let ratesLoaded = false;


/* =====================================================
   GST
   ===================================================== */

const CGST_RATE = 0.09;

const SGST_RATE = 0.09;


/* =====================================================
   DOM ELEMENTS
   ===================================================== */

const quoteForm =
  document.getElementById("quoteForm");

const clientNameInput =
  document.getElementById("clientName");

const companyNameInput =
  document.getElementById("companyName");

const thicknessSelect =
  document.getElementById("thickness");

const typeOfSheetSelect =
  document.getElementById("typeOfSheet");

const quantityInput =
  document.getElementById("quantity");

const selectedThicknessSpan =
  document.getElementById("selectedThickness");

const selectedTypeSpan =
  document.getElementById("selectedType");

const rateDisplay =
  document.getElementById("rateDisplay");

const quantityDisplay =
  document.getElementById("quantityDisplay");

const subtotalDisplay =
  document.getElementById("subtotalDisplay");

const cgstDisplay =
  document.getElementById("cgstDisplay");

const sgstDisplay =
  document.getElementById("sgstDisplay");

const totalDisplay =
  document.getElementById("totalDisplay");

const cgstRow =
  document.getElementById("cgstRow");

const sgstRow =
  document.getElementById("sgstRow");

const submitBtn =
  document.getElementById("submitBtn");

const resetBtn =
  document.getElementById("resetBtn");

const statusMessage =
  document.getElementById("statusMessage");

const orderListDiv =
  document.getElementById("orderList");

const gstRadios =
  document.querySelectorAll(
    'input[name="gst"]'
  );


/* =====================================================
   LOCAL ORDER HISTORY
   ===================================================== */

let orders = [];

try {

  orders =
    JSON.parse(
      localStorage.getItem(
        "steelSheetOrders"
      )
    ) || [];

} catch(error) {

  orders = [];

}


/* =====================================================
   FORMAT MONEY
   ===================================================== */

function formatMoney(amount) {

  return "₹" +
    Number(amount || 0).toLocaleString(
      "en-IN",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}


/* =====================================================
   STATUS MESSAGE
   ===================================================== */

function showStatus(message, type) {

  statusMessage.textContent =
    message;

  statusMessage.className =
    "status " + type;

}


/* =====================================================
   LOAD RATES FROM rates.txt
   ===================================================== */

async function loadRates() {

  try {

    const response =
      await fetch(
        RATES_FILE + "?v=" + Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "Could not load rates.txt"
      );

    }

    const text =
      await response.text();

    rates = {};

    const lines =
      text.split(/\r?\n/);

    lines.forEach(
      function(line) {

        line =
          line.trim();

        if (!line) {
          return;
        }

        if (line.startsWith("#")) {
          return;
        }

        const parts =
          line.split("|");

        if (parts.length < 4) {
          return;
        }

        const thickness =
          parts[0].trim();

        const type =
          parts[1].trim();

        const gstType =
          parts[2].trim();

        const rate =
          parseFloat(
            parts[3].trim()
          );

        if (
          thickness &&
          type &&
          gstType &&
          !isNaN(rate)
        ) {

          const key =
            getRateKey(
              thickness,
              type,
              gstType === "GST"
            );

          rates[key] =
            rate;

        }

      }
    );

    ratesLoaded = true;

    updateCalculation();

    showStatus(
      "Rates loaded successfully.",
      "info"
    );

    setTimeout(
      function() {

        statusMessage.className =
          "status";

      },
      2000
    );

  } catch(error) {

    console.error(
      "Rate loading error:",
      error
    );

    ratesLoaded = false;

    showStatus(
      "Could not load rates.txt. Please check that rates.txt is in the same folder as the HTML file.",
      "error"
    );

  }

}


/* =====================================================
   RATE KEY
   ===================================================== */

function getRateKey(
  thickness,
  type,
  gstSelected
) {

  const gstType =
    gstSelected
      ? "GST"
      : "Non-GST";

  return (
    thickness +
    "|" +
    type +
    "|" +
    gstType
  ).toLowerCase();

}


/* =====================================================
   GET RATE
   ===================================================== */

function getRate(
  thickness,
  type,
  gstSelected
) {

  if (!thickness || !type) {

    return 0;

  }

  const key =
    getRateKey(
      thickness,
      type,
      gstSelected
    );

  return Number(
    rates[key] || 0
  );

}


/* =====================================================
   CALCULATION
   ===================================================== */

function getCalculation() {

  const thickness =
    thicknessSelect.value;

  const typeOfSheet =
    typeOfSheetSelect.value;

  const quantity =
    parseInt(
      quantityInput.value,
      10
    ) || 0;

  const gstSelected =
    document.querySelector(
      'input[name="gst"]:checked'
    ).value === "yes";

  const pricePerSheet =
    getRate(
      thickness,
      typeOfSheet,
      gstSelected
    );

  const subtotal =
    pricePerSheet * quantity;

  let cgstAmount = 0;

  let sgstAmount = 0;

  if (gstSelected) {

    cgstAmount =
      subtotal * CGST_RATE;

    sgstAmount =
      subtotal * SGST_RATE;

  }

  const total =
    subtotal +
    cgstAmount +
    sgstAmount;

  return {

    thickness:
      thickness,

    typeOfSheet:
      typeOfSheet,

    quantity:
      quantity,

    pricePerSheet:
      pricePerSheet,

    subtotal:
      subtotal,

    cgstAmount:
      cgstAmount,

    sgstAmount:
      sgstAmount,

    total:
      total,

    gstSelected:
      gstSelected

  };

}


/* =====================================================
   UPDATE CALCULATION DISPLAY
   ===================================================== */

function updateCalculation() {

  const calc =
    getCalculation();

  const selectedOption =
    thicknessSelect.options[
      thicknessSelect.selectedIndex
    ];


  if (calc.thickness) {

    selectedThicknessSpan.textContent =
      selectedOption.text;

  } else {

    selectedThicknessSpan.textContent =
      "—";

  }


  if (calc.typeOfSheet) {

    selectedTypeSpan.textContent =
      calc.typeOfSheet;

  } else {

    selectedTypeSpan.textContent =
      "—";

  }


  rateDisplay.textContent =
    ratesLoaded && calc.pricePerSheet
      ? formatMoney(
          calc.pricePerSheet
        )
      : "₹0.00";


  quantityDisplay.textContent =
    calc.quantity +
    " sheets";


  subtotalDisplay.textContent =
    formatMoney(
      calc.subtotal
    );


  cgstDisplay.textContent =
    formatMoney(
      calc.cgstAmount
    );


  sgstDisplay.textContent =
    formatMoney(
      calc.sgstAmount
    );


  totalDisplay.textContent =
    formatMoney(
      calc.total
    );


  if (calc.gstSelected) {

    cgstRow.style.display =
      "flex";

    sgstRow.style.display =
      "flex";

  } else {

    cgstRow.style.display =
      "none";

    sgstRow.style.display =
      "none";

  }

}


/* =====================================================
   EVENT LISTENERS
   ===================================================== */

thicknessSelect.addEventListener(
  "change",
  updateCalculation
);


typeOfSheetSelect.addEventListener(
  "change",
  updateCalculation
);


quantityInput.addEventListener(
  "input",
  updateCalculation
);


gstRadios.forEach(
  function(radio) {

    radio.addEventListener(
      "change",
      updateCalculation
    );

  }
);


/* =====================================================
   SUBMIT ORDER
   ===================================================== */

quoteForm.addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();


    /* CUSTOMER VALIDATION */

    const clientName =
      clientNameInput.value.trim();

    const companyName =
      companyNameInput.value.trim();


    if (!clientName) {

      showStatus(
        "Please enter Client Name.",
        "error"
      );

      clientNameInput.focus();

      return;

    }


    if (!companyName) {

      showStatus(
        "Please enter Company Name.",
        "error"
      );

      companyNameInput.focus();

      return;

    }


    /* CALCULATION VALIDATION */

    const calc =
      getCalculation();


    if (!calc.thickness) {

      showStatus(
        "Please select a sheet thickness.",
        "error"
      );

      return;

    }


    if (!calc.typeOfSheet) {

      showStatus(
        "Please select Type of Sheet.",
        "error"
      );

      return;

    }


    if (
      !calc.quantity ||
      calc.quantity < 1
    ) {

      showStatus(
        "Please enter a valid quantity.",
        "error"
      );

      return;

    }


    if (
      !ratesLoaded ||
      calc.pricePerSheet <= 0
    ) {

      showStatus(
        "Rate not found for the selected Gauge, Type and GST option. Please check rates.txt.",
        "error"
      );

      return;

    }


    /* ORDER NUMBER */

    const orderNo =
      "ORD-" + Date.now();


    const selectedOption =
      thicknessSelect.options[
        thicknessSelect.selectedIndex
      ];


    /* DATA TO GOOGLE SHEETS */

    const orderData = {

      orderNo:
        orderNo,

      clientName:
        clientName,

      companyName:
        companyName,

      thickness:
        selectedOption.text,

      type:
        calc.typeOfSheet,

      quantity:
        calc.quantity,

      pricePerSheet:
        calc.pricePerSheet,

      subtotal:
        calc.subtotal,

      cgstAmount:
        calc.cgstAmount,

      sgstAmount:
        calc.sgstAmount,

      total:
        calc.total,

      gstType:
        calc.gstSelected
          ? "CGST 9% + SGST 9%"
          : "Non-GST"

    };


    /* DISABLE BUTTON */

    submitBtn.disabled =
      true;

    submitBtn.textContent =
      "⏳ Saving...";


    showStatus(
      "Saving order to Google Sheets...",
      "info"
    );


    /* SEND TO APPS SCRIPT */

    try {

      const response =
        await fetch(
          GOOGLE_SCRIPT_URL,
          {

            method:
              "POST",

            redirect:
              "follow",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(
                orderData
              )

          }
        );


      if (!response.ok) {

        throw new Error(
          "Server returned HTTP " +
          response.status
        );

      }


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.error ||
          "Google Sheets did not confirm the save."
        );

      }


      /* SAVE LOCAL ORDER */

      const savedOrderNo =
        result.orderNo ||
        orderNo;


      const localOrder = {

        id:
          Date.now(),

        orderNo:
          savedOrderNo,

        clientName:
          clientName,

        companyName:
          companyName,

        thickness:
          selectedOption.text,

        type:
          calc.typeOfSheet,

        quantity:
          calc.quantity,

        pricePerSheet:
          calc.pricePerSheet,

        subtotal:
          calc.subtotal,

        cgstAmount:
          calc.cgstAmount,

        sgstAmount:
          calc.sgstAmount,

        total:
          calc.total,

        gst:
          calc.gstSelected,

        createdAt:
          new Date().toLocaleString()

      };


      orders.push(
        localOrder
      );


      localStorage.setItem(
        "steelSheetOrders",
        JSON.stringify(
          orders
        )
      );


      renderOrders();


      showStatus(
        "✅ Order saved successfully! Order No: " +
        savedOrderNo,
        "success"
      );


      /* RESET FORM */

      resetForm(false);


    } catch(error) {

      console.error(
        "Google Sheets error:",
        error
      );


      showStatus(
        "❌ Could not save to Google Sheets. " +
        error.message,
        "error"
      );


    } finally {

      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "📩 Submit Order";

    }

  }
);


/* =====================================================
   RESET FORM
   ===================================================== */

function resetForm(
  showMessage = true
) {

  quoteForm.reset();


  document.querySelector(
    'input[name="gst"][value="no"]'
  ).checked = true;


  quantityInput.value =
    1;


  updateCalculation();


  if (showMessage) {

    showStatus(
      "Form has been reset.",
      "info"
    );

  }

}


resetBtn.addEventListener(
  "click",
  function() {

    resetForm(true);

  }
);


/* =====================================================
   ORDER HISTORY
   ===================================================== */

function renderOrders() {

  orderListDiv.innerHTML =
    "";


  if (orders.length === 0) {

    orderListDiv.innerHTML =
      "<p>No orders yet.</p>";

    return;

  }


  const latestOrders =
    orders
      .slice()
      .reverse()
      .slice(0, 20);


  latestOrders.forEach(
    function(order) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "order-card";


      card.innerHTML = `

        <div>
          <strong>Order No:</strong>
          ${order.orderNo}
        </div>

        <div>
          <strong>Client:</strong>
          ${order.clientName || ""}
        </div>

        <div>
          <strong>Company:</strong>
          ${order.companyName || ""}
        </div>

        <div>
          <strong>Thickness:</strong>
          ${order.thickness || ""}
        </div>

        <div>
          <strong>Type:</strong>
          ${order.type || ""}
        </div>

        <div>
          <strong>Quantity:</strong>
          ${order.quantity || 0}
        </div>

        <div>
          <strong>Total:</strong>
          ${formatMoney(order.total)}
        </div>

        <div>
          <strong>Date:</strong>
          ${order.createdAt || ""}
        </div>

      `;


      orderListDiv.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   INITIAL DISPLAY
   ===================================================== */

updateCalculation();

renderOrders();

loadRates();


</script>

</body>

</html>
