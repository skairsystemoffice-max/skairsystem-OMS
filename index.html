<style>

</style>

```

</div>

<script>


/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
   =====================================================

   AFTER DEPLOYING GOOGLE APPS SCRIPT:

   Deploy
   → New deployment
   → Web app
   → Execute as: Me
   → Who has access: Anyone

   Copy the /exec URL and paste it below.

===================================================== */


const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbz3Hxozq8t-mxaD9zJeLaWbu3yBGknQBkFL1Wz7iCuCgW5v9cloE5CjKFpLQCr9fdvM/exec";


/* =====================================================
   RATES
===================================================== */

const rates = {

    "1": 1250,

    "2": 1400,

    "3": 1550,

    "4": 7.00,

    "5": 8.50

};


/* =====================================================
   GST
===================================================== */

const CGST_RATE = 0.09;

const SGST_RATE = 0.09;


/* =====================================================
   DOM ELEMENTS
===================================================== */

const thicknessSelect =
    document.getElementById("thickness");


const quantityInput =
    document.getElementById("quantity");


const gstRadios =
    document.querySelectorAll(
        'input[name="gst"]'
    );


const selectedThicknessSpan =
    document.getElementById(
        "selectedThickness"
    );


const rateDisplay =
    document.getElementById(
        "rateDisplay"
    );


const quantityDisplay =
    document.getElementById(
        "quantityDisplay"
    );


const subtotalDisplay =
    document.getElementById(
        "subtotalDisplay"
    );


const cgstDisplay =
    document.getElementById(
        "cgstDisplay"
    );


const sgstDisplay =
    document.getElementById(
        "sgstDisplay"
    );


const totalDisplay =
    document.getElementById(
        "totalDisplay"
    );


const cgstRow =
    document.getElementById(
        "cgstRow"
    );


const sgstRow =
    document.getElementById(
        "sgstRow"
    );


const submitBtn =
    document.getElementById(
        "submitBtn"
    );


const resetBtn =
    document.getElementById(
        "resetBtn"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );


const orderListDiv =
    document.getElementById(
        "orderList"
    );


/* =====================================================
   LOCAL ORDER HISTORY
===================================================== */

let orders =
    JSON.parse(
        localStorage.getItem(
            "steelSheetOrders"
        )
    ) || [];


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(message, type) {

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status " + type;

}


/* =====================================================
   UPDATE CALCULATION
===================================================== */

function updateCalculation() {


    const thickness =
        thicknessSelect.value;


    const quantity =
        parseInt(
            quantityInput.value
        ) || 0;


    const gstSelected =
        document.querySelector(
            'input[name="gst"]:checked'
        ).value === "yes";


    /* PRICE */

    if (
        thickness &&
        rates[thickness]
    ) {


        const selectedOption =
            thicknessSelect.options[
                thicknessSelect.selectedIndex
            ];


        selectedThicknessSpan.textContent =
            selectedOption.text;


        rateDisplay.textContent =
            "₹" +
            rates[thickness].toFixed(2);


    } else {


        selectedThicknessSpan.textContent =
            "—";


        rateDisplay.textContent =
            "₹0.00";

    }


    /* CALCULATION */

    const pricePerSheet =
        rates[thickness] || 0;


    const subtotal =
        pricePerSheet * quantity;


    const cgstAmount =
        gstSelected
            ? subtotal * CGST_RATE
            : 0;


    const sgstAmount =
        gstSelected
            ? subtotal * SGST_RATE
            : 0;


    const total =
        subtotal +
        cgstAmount +
        sgstAmount;


    /* DISPLAY */

    quantityDisplay.textContent =
        quantity + " sheets";


    subtotalDisplay.textContent =
        "₹" +
        subtotal.toFixed(2);


    cgstDisplay.textContent =
        "₹" +
        cgstAmount.toFixed(2);


    sgstDisplay.textContent =
        "₹" +
        sgstAmount.toFixed(2);


    totalDisplay.textContent =
        "₹" +
        total.toFixed(2);


    /* GST VISIBILITY */

    if (gstSelected) {

        cgstRow.style.display =
            "flex";

        sgstRow.style.display =
            "flex";

    } else {

        cgstRow.style.display =
            "none";

        sgstRow.style.display =
            "none";

    }

}


/* =====================================================
   EVENT LISTENERS
===================================================== */

thicknessSelect.addEventListener(
    "change",
    updateCalculation
);


quantityInput.addEventListener(
    "input",
    updateCalculation
);


gstRadios.forEach(
    radio => {

        radio.addEventListener(
            "change",
            updateCalculation
        );

    }
);


/* =====================================================
   INITIAL CALCULATION
===================================================== */

updateCalculation();


/* =====================================================
   SUBMIT ORDER TO GOOGLE SHEETS
===================================================== */

document
    .getElementById("quoteForm")
    .addEventListener(
        "submit",
        async function(e) {


            e.preventDefault();


            /* CHECK GOOGLE URL */

            if (
                GOOGLE_SCRIPT_URL.includes(
                    "PASTE_YOUR"
                )
            ) {

                alert(
                    "Please add your Google Apps Script Web App URL first."
                );

                return;

            }


            /* THICKNESS */

            const thickness =
                thicknessSelect.value;


            if (!thickness) {

                alert(
                    "Please select a sheet thickness."
                );

                return;

            }


            /* QUANTITY */

            const quantity =
                parseInt(
                    quantityInput.value
                );


            if (
                !quantity ||
                quantity < 1
            ) {

                alert(
                    "Please enter a valid quantity."
                );

                return;

            }


            /* GST */

            const gstSelected =
                document.querySelector(
                    'input[name="gst"]:checked'
                ).value === "yes";


            /* RATE */

            const pricePerSheet =
                rates[thickness];


            /* CALCULATE */

            const subtotal =
                pricePerSheet * quantity;


            const cgstAmount =
                gstSelected
                    ? subtotal * CGST_RATE
                    : 0;


            const sgstAmount =
                gstSelected
                    ? subtotal * SGST_RATE
                    : 0;


            const total =
                subtotal +
                cgstAmount +
                sgstAmount;


            /* THICKNESS TEXT */

            const selectedOption =
                thicknessSelect.options[
                    thicknessSelect.selectedIndex
                ];


            /* DATA SENT TO GOOGLE */

            const orderData = {

                thickness:
                    selectedOption.text,

                quantity:
                    quantity,

                pricePerSheet:
                    pricePerSheet,

                subtotal:
                    subtotal,

                cgstAmount:
                    cgstAmount,

                sgstAmount:
                    sgstAmount,

                total:
                    total,

                gstType:
                    gstSelected
                        ? "CGST 9% + SGST 9%"
                        : "Non-GST"

            };


            /* DISABLE BUTTON */

            submitBtn.disabled =
                true;


            submitBtn.textContent =
                "⏳ Saving...";


            try {


                const response =
                    await fetch(
                        GOOGLE_SCRIPT_URL,
                        {

                            method: "POST",

                            mode: "no-cors",

                            headers: {

                                "Content-Type":
                                    "text/plain;charset=utf-8"

                            },

                            body:
                                JSON.stringify(
                                    orderData
                                )

                        }
                    );


                /*
                    no-cors means the browser
                    cannot read the response.

                    If the request reaches
                    Google Apps Script,
                    the data will be saved.
                */


                /* LOCAL COPY */

                const localOrder = {

                    id:
                        Date.now(),

                    thickness:
                        selectedOption.text,

                    quantity:
                        quantity,

                    pricePerSheet:
                        pricePerSheet,

                    gst:
                        gstSelected,

                    cgstAmount:
                        cgstAmount,

                    sgstAmount:
                        sgstAmount,

                    subtotal:
                        subtotal,

                    total:
                        total,

                    createdAt:
                        new Date()
                            .toLocaleString()

                };


                orders.push(
                    localOrder
                );


                localStorage.setItem(
                    "steelSheetOrders",
                    JSON.stringify(
                        orders
                    )
                );


                renderOrders();


                showStatus(
                    "✅ Order submitted successfully and sent to Google Sheets.",
                    "success"
                );


                alert(
                    "✅ Order submitted successfully!"
                );


                resetForm();


            } catch (error) {


                console.error(
                    error
                );


                showStatus(
                    "❌ Unable to send order to Google Sheets.",
                    "error"
                );


                alert(
                    "❌ Could not save order to Google Sheets."
                );


            } finally {


                submitBtn.disabled =
                    false;


                submitBtn.textContent =
                    "📩 Submit Order";

            }


        }
    );


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
    "click",
    resetForm
);


function resetForm() {


    thicknessSelect.value =
        "";


    quantityInput.value =
        "1";


    document.querySelector(
        'input[name="gst"][value="no"]'
    ).checked = true;


    updateCalculation();

}


/* =====================================================
   RENDER LOCAL ORDERS
===================================================== */

function renderOrders() {


    if (
        orders.length === 0
    ) {


        orderListDiv.innerHTML =

            '<div class="empty-orders">' +

            'No orders yet. ' +

            'Submit your first quote above.' +

            '</div>';


        return;

    }


    let html = "";


    orders.forEach(
        (order, index) => {


            const gstLabel =
                order.gst
                    ? "GST: CGST 9% + SGST 9%"
                    : "Non-GST";


            html += `

                <div class="order-card">

                    <div class="order-details">

                        <strong>
                            Order #${index + 1}
                        </strong>

                        (${order.createdAt})

                        <br>

                        Thickness:
                        ${order.thickness}

                        <br>

                        Quantity:
                        ${order.quantity}
                        sheets

                        <br>

                        Rate:
                        ₹${order.pricePerSheet.toFixed(2)}
                        /sheet

                        <br>

                        Subtotal:
                        ₹${order.subtotal.toFixed(2)}

                        <br>

                        CGST (9%):
                        ₹${order.cgstAmount.toFixed(2)}

                        &nbsp; | &nbsp;

                        SGST (9%):
                        ₹${order.sgstAmount.toFixed(2)}

                        <br>

                        <strong>
                            Total:
                            ₹${order.total.toFixed(2)}
                        </strong>

                        <br>

                        ${gstLabel}

                    </div>


                    <div class="order-actions">

                        <button
                            class="edit-btn"
                            onclick="editOrder(${order.id})"
                        >
                            ✏️ Edit
                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteOrder(${order.id})"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>

            `;

        }
    );


    orderListDiv.innerHTML =
        html;

}


/* =====================================================
   EDIT ORDER
===================================================== */

window.editOrder =
    function(id) {


        const order =
            orders.find(
                o => o.id === id
            );


        if (!order) return;


        /* FIND THICKNESS */

        for (
            let i = 0;
            i < thicknessSelect.options.length;
            i++
        ) {


            if (
                thicknessSelect
                    .options[i]
                    .text ===
                order.thickness
            ) {


                thicknessSelect.value =
                    thicknessSelect
                        .options[i]
                        .value;


                break;

            }

        }


        quantityInput.value =
            order.quantity;


        /* GST */

        if (order.gst) {


            document.querySelector(
                'input[name="gst"][value="yes"]'
            ).checked = true;


        } else {


            document.querySelector(
                'input[name="gst"][value="no"]'
            ).checked = true;

        }


        updateCalculation();


        /* REMOVE OLD LOCAL ORDER */

        orders =
            orders.filter(
                o => o.id !== id
            );


        localStorage.setItem(
            "steelSheetOrders",
            JSON.stringify(
                orders
            )
        );


        renderOrders();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    };


/* =====================================================
   DELETE ORDER
===================================================== */

window.deleteOrder =
    function(id) {


        if (
            !confirm(
                "Delete this order?"
            )
        ) return;


        orders =
            orders.filter(
                o => o.id !== id
            );


        localStorage.setItem(
            "steelSheetOrders",
            JSON.stringify(
                orders
            )
        );


        renderOrders();

    };


/* =====================================================
   INITIAL ORDER DISPLAY
===================================================== */

renderOrders();


</script>

</body>
